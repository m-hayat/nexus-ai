# Nexus-AI Platform — local development stack
# Ollama host e already cholche → sudhu Chroma + app containerize korchi.
# `docker compose up -d` diye local infra tule felben.

version: "3.9"

services:
  # ── ChromaDB (vector store) ──
  chroma:
    image: chromadb/chroma:0.5.5
    container_name: nexus-chroma
    ports:
      - "8001:8000"       # host:8001 → container:8000 (8000 already app er)
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── App (optional — dev e local uvicorn prefer) ──
  # Uncomment kore containerize korte parben
  # app:
  #   build: .
  #   container_name: nexus-app
  #   ports:
  #     - "8000:8000"
  #   env_file: .env
  #   environment:
  #     - OLLAMA_BASE_URL=http://host.docker.internal:11434
  #     - CHROMA_HOST=chroma
  #     - CHROMA_PORT=8000
  #   depends_on:
  #     chroma:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  chroma_data:
    driver: local