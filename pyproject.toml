[project]
name = "nexus-ai"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  "langchain-groq>=0.2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "langchain>=0.3",
  "langchain-community>=0.3",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-ollama>=0.2",
  "langchain-text-splitters>=0.3",
  "langchain-chroma>=0.1",      
  "langgraph>=0.2",
  "mcp>=1.0,<2.0",
  "chromadb>=0.5",                
  "rank-bm25>=0.2",
  "langsmith>=0.1",
  "sse-starlette>=2.1",
  "httpx>=0.27",
  "orjson>=3.10",
]
[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"



[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"

# --- এক্সপ্লিসিট প্যাকেজ ডিসকভারি (Windows flat-layout এরর ফিক্স) ---
[tool.setuptools.packages.find]
include = ["app*"]


[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Pragmatic ruleset — style + bug prevention
select = ["E", "F", "W", "I", "UP"]
# Ignored rules with rationale:
ignore = [
  "E501",    # line too long (120 chars allowed)
  "UP017",   # datetime.UTC (timezone.utc is fine)
]

[tool.ruff.lint.per-file-ignores]
# Tests e import order + line length chai na
"tests/*" = ["E402"]
# Scripts e import-after-path-setup allow
"scripts/*" = ["E402"]