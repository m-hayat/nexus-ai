name: Nexus-AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check app/ tests/ main.py scripts/ --output-format=github
        continue-on-error: true

      - name: Type check with mypy
        run: |
          mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run fast tests (no LLM needed)
        run: |
          pytest tests/test_config.py tests/test_mcp.py tests/test_eval_regression.py -v --tb=short

      - name: Run API tests (mock LLM or skip if no Ollama)
        run: |
          pytest tests/test_api.py -v -m "not slow" --tb=short
        continue-on-error: true  # LLM-dependent tests